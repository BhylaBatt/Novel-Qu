<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://mcqaljrpbvwjzvzhkigk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Y3sTZvucMvEXdV9GdwQtGw_CI0t0b2u";


/* =========================================================
   DATA
========================================================= */

let novels = [];
let chapters = [];


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseFetch(table, params = "") {

  const url =
    SUPABASE_URL +
    "/rest/v1/" +
    table +
    (params ? "?" + params : "");

  const response = await fetch(url, {
    method: "GET",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    }
  });

  if (!response.ok) {

    const errorText = await response.text();

    throw new Error(
      "Supabase error " +
      response.status +
      ": " +
      errorText
    );
  }

  return await response.json();
}


/* =========================================================
   LOAD NOVELS
========================================================= */

async function loadNovels() {

  try {

    novels = await supabaseFetch(
      "novels",
      "select=*&order=created_at.desc"
    );

    console.log("Novel berhasil dimuat:", novels);

    renderHome();
    renderCatalog();
    renderGenres();

  } catch (error) {

    console.error("Gagal mengambil novel:", error);

    const message = `
      <div class="empty">
        <b>Gagal mengambil data novel.</b>
        <br><br>
        ${esc(error.message)}
      </div>
    `;

    const home = document.getElementById("homeList");
    const catalog = document.getElementById("catalogList");

    if (home) home.innerHTML = message;
    if (catalog) catalog.innerHTML = message;
  }
}


/* =========================================================
   LOAD CHAPTERS
   NAMA TABEL: chapters
========================================================= */

async function loadChapters(novelId) {

  try {

    const result = await supabaseFetch(
      "chapters",
      "select=id,chapter_number,title,content,views,novel_id&novel_id=eq." +
      encodeURIComponent(novelId) +
      "&order=chapter_number.asc"
    );

    console.log("CHAPTER:", result);

    return result;

  } catch (error) {

    console.error("CHAPTER ERROR:", error);

    throw error;
  }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(x) {

  return String(x ?? "")
    .replace(/[&<>"']/g, m => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[m]));

}


/* =========================================================
   COVER
========================================================= */

function coverHTML(n) {

  if (n.cover_url) {

    return `
      <div class="cover">
        <img
          src="${esc(n.cover_url)}"
          alt="${esc(n.title)}"
          loading="lazy"
        >
      </div>
    `;

  }

  return `
    <div class="cover">
      ▯
    </div>
  `;
}


/* =========================================================
   CARD
========================================================= */

function card(n) {

  return `
    <article
      class="card"
      onclick="detail(${Number(n.id)})"
    >

      ${coverHTML(n)}

      <h3>
        ${esc(n.title || "Tanpa judul")}
      </h3>

      <div class="meta">
        ${esc(n.genre || "Umum")}
        · ⭐ ${n.rating ?? "0"}
      </div>

      <div class="meta">
        👁 ${Number(n.views || 0).toLocaleString("id-ID")}
      </div>

      <p class="desc">
        ${esc(
          n.description ||
          n.desc ||
          "Belum ada deskripsi novel."
        )}
      </p>

    </article>
  `;
}


/* =========================================================
   NAVIGATION
========================================================= */

function go(id) {

  document
    .querySelectorAll(".page")
    .forEach(x => x.classList.remove("active"));

  const page = document.getElementById(id);

  if (page) {
    page.classList.add("active");
  }

  scrollTo(0, 0);

  if (id === "catalog") {
    renderCatalog();
  }

  if (id === "bookmark") {
    renderBookmarks();
  }
}


/* =========================================================
   HOME
========================================================= */

function renderHome() {

  const list = novels
    .slice()
    .sort((a, b) =>
      new Date(b.created_at || 0) -
      new Date(a.created_at || 0)
    )
    .slice(0, 6);

  const homeList =
    document.getElementById("homeList");

  if (!homeList) return;

  homeList.innerHTML =
    list.length
      ? list.map(card).join("")
      : `
        <div class="empty">
          Belum ada novel di database.
        </div>
      `;

  const status =
    document.getElementById("homeStatus");

  if (status) {
    status.textContent =
      novels.length + " novel";
  }
}


/* =========================================================
   CATALOG
========================================================= */

function renderCatalog() {

  const input =
    document.getElementById("q");

  if (!input) return;

  const q =
    input.value
      .toLowerCase()
      .trim();

  const list =
    novels.filter(n => {

      const title =
        String(n.title || "").toLowerCase();

      const genre =
        String(n.genre || "").toLowerCase();

      const slug =
        String(n.slug || "").toLowerCase();

      return (
        title.includes(q) ||
        genre.includes(q) ||
        slug.includes(q)
      );

    });

  const count =
    document.getElementById("count");

  if (count) {
    count.textContent =
      list.length + " novel";
  }

  const catalog =
    document.getElementById("catalogList");

  if (!catalog) return;

  catalog.innerHTML =
    list.length
      ? list.map(card).join("")
      : `
        <div class="empty">
          Novel tidak ditemukan.
        </div>
      `;
}


/* =========================================================
   GENRE
========================================================= */

function renderGenres() {

  const list = [
    ...new Set(
      novels
        .map(n => n.genre)
        .filter(Boolean)
    )
  ];

  const genres =
    document.getElementById("genres");

  if (!genres) return;

  genres.innerHTML =
    list.length
      ? list.map(g => `
          <span
            class="genre"
            onclick="showGenre('${esc(g)}')"
          >
            ${esc(g)}
          </span>
        `).join("")
      : `
        <div class="empty">
          Belum ada genre.
        </div>
      `;
}


function showGenre(g) {

  const list =
    novels.filter(n => n.genre === g);

  const genreList =
    document.getElementById("genreList");

  if (!genreList) return;

  genreList.innerHTML =
    list.length
      ? list.map(card).join("")
      : `
        <div class="empty">
          Tidak ada novel dalam genre ini.
        </div>
      `;
}


/* =========================================================
   BOOKMARK
========================================================= */

function getBookmarks() {

  return JSON.parse(
    localStorage.getItem("nq_marks") || "[]"
  );

}


function saveBookmarks(list) {

  localStorage.setItem(
    "nq_marks",
    JSON.stringify(list)
  );

}


function renderBookmarks() {

  const marks =
    getBookmarks();

  const list =
    novels.filter(n =>
      marks.includes(Number(n.id))
    );

  const bookmarkList =
    document.getElementById("bookmarkList");

  if (!bookmarkList) return;

  bookmarkList.innerHTML =
    list.length
      ? list.map(card).join("")
      : `
        <div class="empty">
          Belum ada bookmark.
        </div>
      `;
}


/* =========================================================
   DETAIL NOVEL
========================================================= */

async function detail(id) {

  const n =
    novels.find(
      x => Number(x.id) === Number(id)
    );

  if (!n) return;

  const detailBox =
    document.getElementById("detailBox");

  detailBox.innerHTML = `

    <div class="back">
      <button
        class="btn"
        onclick="go('catalog')"
      >
        ← Kembali
      </button>
    </div>

    <div class="detail">

      ${coverHTML(n)}

      <h1>
        ${esc(n.title || "Tanpa judul")}
      </h1>

      <div class="meta">

        ${esc(n.genre || "Umum")}

        · ⭐ ${n.rating ?? "0"}

        · 👁 ${Number(
          n.views || 0
        ).toLocaleString("id-ID")}

      </div>

      <p>
        ${esc(
          n.description ||
          n.desc ||
          "Belum ada deskripsi novel."
        )}
      </p>

      <div class="sectionhead">

        <h2>Daftar Bab</h2>

        <span
          id="chapterCount"
          class="meta"
        >
          Memuat...
        </span>

      </div>

      <div id="chapterList">

        <div class="empty">
          Memuat daftar bab...
        </div>

      </div>

    </div>
  `;

  go("detail");

  try {

    const list =
      await loadChapters(id);

    const chapterList =
      document.getElementById("chapterList");

    const chapterCount =
      document.getElementById("chapterCount");

    if (!list || list.length === 0) {

      chapterCount.textContent =
        "0 bab";

      chapterList.innerHTML = `
        <div class="empty">
          Belum ada bab untuk novel ini.
        </div>
      `;

      return;
    }

    chapterCount.textContent =
      list.length + " bab";

    chapterList.innerHTML =
      list.map(ch => `

        <div
          class="chapter"
          onclick="readChapter(
            ${Number(id)},
            ${Number(ch.id)}
          )"
        >

          <span>
            ${esc(
              ch.title ||
              "Bab " + ch.chapter_number
            )}
          </span>

          <span>›</span>

        </div>

      `).join("");

  } catch (error) {

    console.error(error);

    document.getElementById(
      "chapterList"
    ).innerHTML = `

      <div class="empty">

        <b>Gagal mengambil daftar bab.</b>

        <br><br>

        ${esc(error.message)}

      </div>
    `;
  }
}


/* =========================================================
   BOOKMARK TOGGLE
========================================================= */

function toggleMark(id) {

  let marks =
    getBookmarks();

  id = Number(id);

  if (marks.includes(id)) {

    marks =
      marks.filter(
        x => Number(x) !== id
      );

  } else {

    marks.push(id);

  }

  saveBookmarks(marks);

  detail(id);
}


/* =========================================================
   READ CHAPTER
========================================================= */

async function readChapter(
  novelId,
  chapterId
) {

  const n =
    novels.find(
      x =>
        Number(x.id) ===
        Number(novelId)
    );

  if (!n) return;

  const readerBox =
    document.getElementById("readerBox");

  readerBox.innerHTML = `

    <div class="readerbar">

      <button
        onclick="detail(${Number(novelId)})"
      >
        ← Daftar Bab
      </button>

      <span>
        Memuat...
      </span>

      <div>

        <button onclick="font(-1)">
          A−
        </button>

        <button onclick="font(1)">
          A+
        </button>

      </div>

    </div>

    <article
      class="reader"
      id="article"
    >

      <h1>
        ${esc(n.title)}
      </h1>

      <div class="loading">
        Memuat isi bab...
      </div>

    </article>
  `;

  go("reader");

  try {

    const result =
      await supabaseFetch(
        "chapters",
        "select=*&id=eq." +
        encodeURIComponent(chapterId)
      );

    if (!result.length) {

      document.getElementById(
        "article"
      ).innerHTML = `
        <div class="empty">
          Bab tidak ditemukan.
        </div>
      `;

      return;
    }

    const ch = result[0];

    const title =
      ch.title ||
      "Bab " + ch.chapter_number;

    const content =
      ch.content || "";

    const bar =
      document
        .getElementById("readerBox")
        .querySelector(
          ".readerbar span"
        );

    bar.textContent = title;

    document.getElementById(
      "article"
    ).innerHTML = `

      <h1>
        ${esc(n.title)}
      </h1>

      <h2>
        ${esc(title)}
      </h2>

      ${
        content
          ? formatChapter(content)
          : `
            <p>
              Isi bab belum tersedia.
            </p>
          `
      }

    `;

  } catch (error) {

    document.getElementById(
      "article"
    ).innerHTML = `

      <div class="error">

        <b>
          Gagal mengambil isi bab.
        </b>

        <br><br>

        ${esc(error.message)}

      </div>

    `;
  }
}


/* =========================================================
   FORMAT CHAPTER
========================================================= */

function formatChapter(text) {

  return String(text)
    .split(/\n\s*\n/)
    .map(p => {

      if (!p.trim()) return "";

      return `
        <p>
          ${esc(p).replace(
            /\n/g,
            "<br>"
          )}
        </p>
      `;

    })
    .join("");
}


/* =========================================================
   FONT READER
========================================================= */

function font(x) {

  const r =
    document.querySelector(".reader");

  if (!r) return;

  const size =
    parseFloat(
      getComputedStyle(r)
        .fontSize
    );

  r.style.fontSize =
    Math.max(
      14,
      Math.min(
        30,
        size + x
      )
    ) + "px";
}


/* =========================================================
   START
========================================================= */

loadNovels();

      </script><script>

    console.error("Gagal mengambil novel:", error);

    const message = `
      <div class="empty">
        <b>Gagal mengambil data novel.</b>
        <br><br>
        ${esc(error.message)}
      </div>
    `;

    const home = document.getElementById("homeList");
    const catalog = document.getElementById("catalogList");

    if (home) home.innerHTML = message;
    if (catalog) catalog.innerHTML = message;
  }
}

/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(x) {

  return String(x ?? "")
    .replace(/[&<>"']/g, m => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[m]));

}


/* =========================================================
   COVER
========================================================= */

function coverHTML(n) {

  if (n.cover_url) {

    return `
      <div class="cover">
        <img
          src="${esc(n.cover_url)}"
          alt="${esc(n.title)}"
          loading="lazy"
        >
      </div>
    `;

  }

  return `
    <div class="cover">
      ▯
    </div>
  `;
}


/* =========================================================
   CARD
========================================================= */

function card(n) {

  return `
    <article
      class="card"
      onclick="detail(${Number(n.id)})"
    >

      ${coverHTML(n)}

      <h3>
        ${esc(n.title || "Tanpa judul")}
      </h3>

      <div class="meta">
        ${esc(n.genre || "Umum")}
        · ⭐ ${n.rating ?? "0"}
      </div>

      <div class="meta">
        👁 ${Number(n.views || 0).toLocaleString("id-ID")}
      </div>

      <p class="desc">
        ${esc(
          n.description ||
          n.desc ||
          "Belum ada deskripsi novel."
        )}
      </p>

    </article>
  `;
}


/* =========================================================
   NAVIGATION
========================================================= */

function go(id) {

  document
    .querySelectorAll(".page")
    .forEach(x => x.classList.remove("active"));

  const page = document.getElementById(id);

  if (page) {
    page.classList.add("active");
  }

  scrollTo(0, 0);

  if (id === "catalog") {
    renderCatalog();
  }

  if (id === "bookmark") {
    renderBookmarks();
  }
}


/* =========================================================
   HOME
========================================================= */

function renderHome() {

  const list = novels
    .slice()
    .sort((a, b) =>
      new Date(b.created_at || 0) -
      new Date(a.created_at || 0)
    )
    .slice(0, 6);

  const homeList =
    document.getElementById("homeList");

  if (!homeList) return;

  homeList.innerHTML =
    list.length
      ? list.map(card).join("")
      : `
        <div class="empty">
          Belum ada novel di database.
        </div>
      `;

  const status =
    document.getElementById("homeStatus");

  if (status) {
    status.textContent =
      novels.length + " novel";
  }
}


/* =========================================================
   CATALOG
========================================================= */

function renderCatalog() {

  const input =
    document.getElementById("q");

  if (!input) return;

  const q =
    input.value
      .toLowerCase()
      .trim();

  const list =
    novels.filter(n => {

      const title =
        String(n.title || "").toLowerCase();

      const genre =
        String(n.genre || "").toLowerCase();

      const slug =
        String(n.slug || "").toLowerCase();

      return (
        title.includes(q) ||
        genre.includes(q) ||
        slug.includes(q)
      );

    });

  const count =
    document.getElementById("count");

  if (count) {
    count.textContent =
      list.length + " novel";
  }

  const catalog =
    document.getElementById("catalogList");

  if (!catalog) return;

  catalog.innerHTML =
    list.length
      ? list.map(card).join("")
      : `
        <div class="empty">
          Novel tidak ditemukan.
        </div>
      `;
}


/* =========================================================
   GENRE
========================================================= */

function renderGenres() {

  const list = [
    ...new Set(
      novels
        .map(n => n.genre)
        .filter(Boolean)
    )
  ];

  const genres =
    document.getElementById("genres");

  if (!genres) return;

  genres.innerHTML =
    list.length
      ? list.map(g => `
          <span
            class="genre"
            onclick="showGenre('${esc(g)}')"
          >
            ${esc(g)}
          </span>
        `).join("")
      : `
        <div class="empty">
          Belum ada genre.
        </div>
      `;
}


function showGenre(g) {

  const list =
    novels.filter(n => n.genre === g);

  const genreList =
    document.getElementById("genreList");

  if (!genreList) return;

  genreList.innerHTML =
    list.length
      ? list.map(card).join("")
      : `
        <div class="empty">
          Tidak ada novel dalam genre ini.
        </div>
      `;
}


/* =========================================================
   BOOKMARK
========================================================= */

function getBookmarks() {

  return JSON.parse(
    localStorage.getItem("nq_marks") || "[]"
  );

}


function saveBookmarks(list) {

  localStorage.setItem(
    "nq_marks",
    JSON.stringify(list)
  );

}


function renderBookmarks() {

  const marks =
    getBookmarks();

  const list =
    novels.filter(n =>
      marks.includes(Number(n.id))
    );

  const bookmarkList =
    document.getElementById("bookmarkList");

  if (!bookmarkList) return;

  bookmarkList.innerHTML =
    list.length
      ? list.map(card).join("")
      : `
        <div class="empty">
          Belum ada bookmark.
        </div>
      `;
}


/* =========================================================
   DETAIL NOVEL
========================================================= */

async function detail(id) {

  const n =
    novels.find(
      x => Number(x.id) === Number(id)
    );

  if (!n) return;

  const detailBox =
    document.getElementById("detailBox");

  detailBox.innerHTML = `

    <div class="back">
      <button
        class="btn"
        onclick="go('catalog')"
      >
        ← Kembali
      </button>
    </div>

    <div class="detail">

      ${coverHTML(n)}

      <h1>
        ${esc(n.title || "Tanpa judul")}
      </h1>

      <div class="meta">

        ${esc(n.genre || "Umum")}

        · ⭐ ${n.rating ?? "0"}

        · 👁 ${Number(
          n.views || 0
        ).toLocaleString("id-ID")}

      </div>

      <p>
        ${esc(
          n.description ||
          n.desc ||
          "Belum ada deskripsi novel."
        )}
      </p>

      <div class="sectionhead">

        <h2>Daftar Bab</h2>

        <span
          id="chapterCount"
          class="meta"
        >
          Memuat...
        </span>

      </div>

      <div id="chapterList">

        <div class="empty">
          Memuat daftar bab...
        </div>

      </div>

    </div>
  `;

  go("detail");

  try {

    const list =
      await loadChapters(id);

    const chapterList =
      document.getElementById("chapterList");

    const chapterCount =
      document.getElementById("chapterCount");

    if (!list || list.length === 0) {

      chapterCount.textContent =
        "0 bab";

      chapterList.innerHTML = `
        <div class="empty">
          Belum ada bab untuk novel ini.
        </div>
      `;

      return;
    }

    chapterCount.textContent =
      list.length + " bab";

    chapterList.innerHTML =
      list.map(ch => `

        <div
          class="chapter"
          onclick="readChapter(
            ${Number(id)},
            ${Number(ch.id)}
          )"
        >

          <span>
            ${esc(
              ch.title ||
              "Bab " + ch.chapter_number
            )}
          </span>

          <span>›</span>

        </div>

      `).join("");

  } catch (error) {

    console.error(error);

    document.getElementById(
      "chapterList"
    ).innerHTML = `

      <div class="empty">

        <b>Gagal mengambil daftar bab.</b>

        <br><br>

        ${esc(error.message)}

      </div>
    `;
  }
}


/* =========================================================
   BOOKMARK TOGGLE
========================================================= */

function toggleMark(id) {

  let marks =
    getBookmarks();

  id = Number(id);

  if (marks.includes(id)) {

    marks =
      marks.filter(
        x => Number(x) !== id
      );

  } else {

    marks.push(id);

  }

  saveBookmarks(marks);

  detail(id);
}


/* =========================================================
   READ CHAPTER
========================================================= */

async function readChapter(
  novelId,
  chapterId
) {

  const n =
    novels.find(
      x =>
        Number(x.id) ===
        Number(novelId)
    );

  if (!n) return;

  const readerBox =
    document.getElementById("readerBox");

  readerBox.innerHTML = `

    <div class="readerbar">

      <button
        onclick="detail(${Number(novelId)})"
      >
        ← Daftar Bab
      </button>

      <span>
        Memuat...
      </span>

      <div>

        <button onclick="font(-1)">
          A−
        </button>

        <button onclick="font(1)">
          A+
        </button>

      </div>

    </div>

    <article
      class="reader"
      id="article"
    >

      <h1>
        ${esc(n.title)}
      </h1>

      <div class="loading">
        Memuat isi bab...
      </div>

    </article>
  `;

  go("reader");

  try {

    const result =
      await supabaseFetch(
        "chapters",
        "select=*&id=eq." +
        encodeURIComponent(chapterId)
      );

    if (!result.length) {

      document.getElementById(
        "article"
      ).innerHTML = `
        <div class="empty">
          Bab tidak ditemukan.
        </div>
      `;

      return;
    }

    const ch = result[0];

    const title =
      ch.title ||
      "Bab " + ch.chapter_number;

    const content =
      ch.content || "";

    const bar =
      document
        .getElementById("readerBox")
        .querySelector(
          ".readerbar span"
        );

    bar.textContent = title;

    document.getElementById(
      "article"
    ).innerHTML = `

      <h1>
        ${esc(n.title)}
      </h1>

      <h2>
        ${esc(title)}
      </h2>

      ${
        content
          ? formatChapter(content)
          : `
            <p>
              Isi bab belum tersedia.
            </p>
          `
      }

    `;

  } catch (error) {

    document.getElementById(
      "article"
    ).innerHTML = `

      <div class="error">

        <b>
          Gagal mengambil isi bab.
        </b>

        <br><br>

        ${esc(error.message)}

      </div>

    `;
  }
}


/* =========================================================
   FORMAT CHAPTER
========================================================= */

function formatChapter(text) {

  return String(text)
    .split(/\n\s*\n/)
    .map(p => {

      if (!p.trim()) return "";

      return `
        <p>
          ${esc(p).replace(
            /\n/g,
            "<br>"
          )}
        </p>
      `;

    })
    .join("");
}


/* =========================================================
   FONT READER
========================================================= */

function font(x) {

  const r =
    document.querySelector(".reader");

  if (!r) return;

  const size =
    parseFloat(
      getComputedStyle(r)
        .fontSize
    );

  r.style.fontSize =
    Math.max(
      14,
      Math.min(
        30,
        size + x
      )
    ) + "px";
}
