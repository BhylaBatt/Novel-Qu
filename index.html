<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Novel Qu - Baca novel online gratis">
<title>Novel Qu - Baca Novel Gratis</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172333;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#fff;border-bottom:1px solid #e5e8ec;position:sticky;top:0;z-index:10}
.wrap{max-width:900px;margin:auto;padding:0 16px}.top{height:70px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:23px;font-weight:900}.logo small{display:block;font-size:11px;color:#737c86;font-weight:500}
nav{display:flex;gap:8px;overflow:auto;padding:0 0 10px}.navbtn,.bottom button{border:0;background:none;padding:8px 12px;color:#66717d;font-size:14px}
.navbtn.active,.bottom button.active{color:#172333;font-weight:800}
.search{background:#fff;border:1px solid #e5e8ec;border-radius:12px;padding:10px 12px;margin:16px 0}
.search input{border:0;outline:0;width:100%;font-size:15px}
.page{display:none;padding:20px 0 90px}.page.active{display:block}
.hero{background:linear-gradient(120deg,#eef3f8,#fff);border-radius:22px;padding:32px 24px;margin-bottom:24px}
.hero h1{font-size:34px;margin:0 0 12px}.hero p{color:#68727d;line-height:1.7}
.btn{display:inline-block;border:0;border-radius:12px;background:#172333;color:white;padding:12px 18px;font-weight:800}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.sectionhead h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#fff;border:1px solid #e5e8ec;border-radius:16px;padding:16px;cursor:pointer}
.cover{height:130px;border-radius:12px;background:#edf1f5;display:grid;place-items:center;color:#9aa4af;font-size:42px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}.meta,.desc{font-size:13px;color:#737c86}.desc{line-height:1.6}
.genre{display:inline-block;background:#eef3f8;border-radius:20px;padding:4px 8px;margin:3px;font-size:12px;cursor:pointer}
.detail{background:#fff;border-radius:18px;padding:20px;border:1px solid #e5e8ec}
.back{margin-bottom:14px}.chapter{display:flex;justify-content:space-between;gap:10px;padding:13px 4px;border-bottom:1px solid #edf0f3;cursor:pointer}
.reader{background:#fff;border-radius:16px;padding:22px;line-height:2;font-size:18px;border:1px solid #e5e8ec}
.readerbar{display:flex;gap:8px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.readerbar button{border:1px solid #dfe4e9;background:#fff;border-radius:9px;padding:8px 12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e8ec;display:flex;justify-content:space-around;padding:7px;z-index:20}
.empty{padding:30px;text-align:center;color:#737c86}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.bottom{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div class="logo">Novel Qu<small>Baca novel gratis</small></div></div>
  <nav>
    <button class="navbtn active" onclick="go('home')">Beranda</button>
    <button class="navbtn" onclick="go('catalog')">Novel</button>
    <button class="navbtn" onclick="go('bookmark')">Bookmark</button>
    <button class="navbtn" onclick="go('genre')">Genre</button>
  </nav>
</div></header>

<main class="wrap">
<section id="home" class="page active">
  <div class="hero"><h1>Selamat datang di Novel Qu</h1>
  <p>Baca berbagai novel gratis kapan saja, di mana saja. Temukan cerita favoritmu dan nikmati pengalaman membaca yang nyaman.</p>
  <button class="btn" onclick="go('catalog')">Mulai Membaca →</button></div>
  <div class="sectionhead"><h2>Novel Terbaru</h2><span>Gratis</span></div>
  <div id="homeList" class="grid"></div>
</section>

<section id="catalog" class="page">
  <div class="search"><input id="q" placeholder="Cari novel..." oninput="renderCatalog()"></div>
  <div class="sectionhead"><h2>Semua Novel</h2><span id="count"></span></div>
  <div id="catalogList" class="grid"></div>
</section>

<section id="genre" class="page">
  <div class="sectionhead"><h2>Pilih Genre</h2></div><div id="genres"></div>
  <div id="genreList" class="grid"></div>
</section>

<section id="bookmark" class="page">
  <div class="sectionhead"><h2>Bookmark</h2></div><div id="bookmarkList" class="grid"></div>
</section>

<section id="detail" class="page"><div id="detailBox"></div></section>
<section id="reader" class="page"><div id="readerBox"></div></section>
</main>

<div class="bottom">
<button class="active" onclick="go('home')">⌂<br>Beranda</button>
<button onclick="go('catalog')">▤<br>Novel</button>
<button onclick="go('bookmark')">☆<br>Bookmark</button>
<button onclick="go('genre')">◇<br>Genre</button>
</div>

<script>
const novels=[
{id:1,title:"Charlie Wade",genre:"Sunting",chapters:120,rating:4.8,date:"20 Mei 2024",desc:"Kisah seorang pria yang menjalani kehidupan penuh kejutan dan perubahan besar."},
{id:2,title:"Legenda Pedang Abadi",genre:"Fantasi",chapters:120,rating:4.9,date:"18 Mei 2024",desc:"Seorang pemuda menempuh jalan pedang untuk mencari kekuatan dan kebenaran."},
{id:3,title:"Reinkarnasi Sang Raja",genre:"Fantasi",chapters:95,rating:4.7,date:"17 Mei 2024",desc:"Sang raja kembali ke masa lalu dan memulai perjalanan keduanya."},
{id:4,title:"Dewa Pedang Terakhir",genre:"Aksi",chapters:310,rating:4.9,date:"10 Mei 2024",desc:"Perjalanan seorang pendekar menuju puncak dunia persilatan."},
{id:5,title:"Cinta di Balik Hujan",genre:"Romantis",chapters:76,rating:4.6,date:"12 Mei 2024",desc:"Kisah pertemuan dua hati yang dipertemukan oleh hujan."},
{id:6,title:"Pewaris Tak Terkalahkan",genre:"Aksi",chapters:208,rating:4.8,date:"15 Mei 2024",desc:"Seorang pewaris menemukan kekuatan yang selama ini tersembunyi."}
];
const marks=()=>JSON.parse(localStorage.getItem("nq_marks")||"[]");
const saveMarks=x=>localStorage.setItem("nq_marks",JSON.stringify(x));
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function card(n){return `<article class="card" onclick="detail(${n.id})"><div class="cover">▯</div><h3>${esc(n.title)}</h3><div class="meta">${n.genre} · ⭐ ${n.rating}</div><p class="desc">${esc(n.desc)}</p></article>`}
function go(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0);if(id==="catalog")renderCatalog();if(id==="bookmark")renderBookmarks();}
function renderHome(){homeList.innerHTML=novels.slice(0,4).map(card).join("")}
function renderCatalog(){let q=(document.getElementById("q")?.value||"").toLowerCase();let a=novels.filter(n=>(n.title+n.genre).toLowerCase().includes(q));count.textContent=a.length+" novel";catalogList.innerHTML=a.length?a.map(card).join(""):'<div class="empty">Novel tidak ditemukan.</div>'}
function renderGenres(){let gs=[...new Set(novels.map(n=>n.genre))];genres.innerHTML=gs.map(g=>`<span class="genre" onclick="showGenre('${esc(g)}')">${esc(g)}</span>`).join("")}
function showGenre(g){genreList.innerHTML=novels.filter(n=>n.genre===g).map(card).join("")}
function renderBookmarks(){let a=novels.filter(n=>marks().includes(n.id));bookmarkList.innerHTML=a.length?a.map(card).join(""):'<div class="empty">Belum ada bookmark.</div>'}
function detail(id){let n=novels.find(x=>x.id===id),m=marks(),saved=m.includes(id);detailBox.innerHTML=`<div class="back"><button class="btn" onclick="go('catalog')">← Kembali</button></div><div class="detail"><div class="cover">▯</div><h1>${esc(n.title)}</h1><div class="meta">${n.genre} · ⭐ ${n.rating} · ${n.chapters} bab</div><p>${esc(n.desc)}</p><button class="btn" onclick="toggleMark(${id})">${saved?"★ Hapus Bookmark":"☆ Bookmark"}</button><div class="sectionhead"><h2>Daftar Bab</h2></div>${Array.from({length:n.chapters},(_,i)=>`<div class="chapter" onclick="read(${id},${i+1})"><span>Bab ${i+1}</span><span>›</span></div>`).slice(0,30).join("")}</div>`;go("detail")}
function toggleMark(id){let m=marks();m=m.includes(id)?m.filter(x=>x!==id):[...m,id];saveMarks(m);detail(id)}
function read(id,ch){let n=novels.find(x=>x.id===id);readerBox.innerHTML=`<div class="readerbar"><button onclick="detail(${id})">← Daftar Bab</button><span>Bab ${ch}</span><div><button onclick="font(-1)">A−</button><button onclick="font(1)">A+</button></div></div><article class="reader"><h1>${esc(n.title)}</h1><h2>Bab ${ch}</h2><p>Ini adalah halaman pembaca Novel Qu. Konten bab dapat kamu isi atau tambahkan ke data novel. Nikmati membaca dengan nyaman.</p><p>Setiap bab dapat memiliki teks cerita sendiri. Nantinya kita bisa memasukkan seluruh isi novel dan membuat navigasi bab sebelumnya dan berikutnya.</p></article>`;go("reader")}
function font(x){let r=document.querySelector(".reader");if(r)r.style.fontSize=(parseFloat(getComputedStyle(r).fontSize)+x)+"px"}
renderHome();renderCatalog();renderGenres();
</script>
</body></html>
